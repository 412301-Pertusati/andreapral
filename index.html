    --sage-light: oklch(90% 0.04 155);
    --muted: oklch(55% 0.02 60);
    --border: oklch(88% 0.02 60);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--brown);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;

  h1,h2,h3,h4 { font-family: 'Playfair Display', serif; }
  ::selection { background: var(--terra-light); }

  /* ── RESPONSIVE ─────────────────────────────────────────── */

  /* Padding horizontal de secciones */

    section  { padding-left: 20px !important; padding-right: 20px !important; }
    footer   { padding-left: 20px !important; padding-right: 20px !important; }

  }

  /* Nav: ocultar links en mobile */

    .nav-links { display: none !important; }

  /* Features: 4 col → 2 col → 1 col */
  @media (max-width: 768px) {
    .feat-grid { grid-template-columns: 1fr 1fr !important; }
    .feat-item { border-right: none !important; border-bottom: 1px solid var(--border) !important; }
    .feat-item:nth-child(odd)  { border-right: 1px solid var(--border) !important; }

    .feat-item { border-right: none !important; border-bottom: 1px solid var(--border) !important; }

  /* Calendar: sidebar debajo del grid */

    .cal-layout { grid-template-columns: 1fr !important; }
  }

/* ── CACHE EN MEMORIA ────────────────────────────────────────────────────── */
const eventsCache = {}; // clave: 'YYYY-MM', valor: array de eventos ya mapeados

/* ── FETCH VÍA PROXY SERVERLESS ─────────────────────────────────────────── */
// Las credenciales viven en Vercel → Settings → Environment Variables.
// Este fetch llama a /api/calendar, que nunca expone CALENDAR_ID ni API_KEY.
async function fetchGoogleCalendarEvents(year, month) {
  const pad = n => String(n).padStart(2, '0');
  const cacheKey = `${year}-${pad(month + 1)}`;
  if (eventsCache[cacheKey]) return eventsCache[cacheKey];

  const res = await fetch(`/api/calendar?year=${year}&month=${month + 1}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body?.error || `Error ${res.status} al obtener el calendario`);
  }
  const events = await res.json();

  eventsCache[cacheKey] = events;
  return events;
}

function Calendar() {
  const [currentDate, setCurrentDate] = useState(() => new Date());
  const [selectedDay, setSelectedDay]  = useState(null);
  const [events, setEvents]            = useState([]);
  const [loading, setLoading]          = useState(false);
  const [error, setError]              = useState(null);
  const [retryCount, setRetryCount]    = useState(0);

  const year  = currentDate.getFullYear();
  const month = currentDate.getMonth(); // 0-indexed

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setError(null);
    setSelectedDay(null);
    fetchGoogleCalendarEvents(year, month)
      .then(evts => { if (!cancelled) { setEvents(evts); setLoading(false); } })
      .catch(err  => { if (!cancelled) { setError(err.message); setLoading(false); } });
    return () => { cancelled = true; };
  }, [year, month, retryCount]);

  const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  const pad       = n => String(n).padStart(2, '0');
  const toDateStr = d => `${year}-${pad(month + 1)}-${pad(d)}`;

  const firstDow    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const eventMap = {};
  events.forEach(e => { eventMap[e.date] = e; });

  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selectedEvent = selectedDay ? eventMap[toDateStr(selectedDay)] : null;

  const changeMonth = dir =>
    setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() + dir, 1));

  const handleRetry = () => {
    delete eventsCache[`${year}-${pad(month + 1)}`];
    setRetryCount(c => c + 1);
  };

  const formatEventDate = dateStr => {
    const [y, m, d] = dateStr.split('-').map(Number);
    const mes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return `${d} de ${mes[m - 1]} de ${y}`;
  };

  return (
    <section id="calendario" style={{ padding: "96px 48px", background: "var(--cream-dark)" }}>
      <div style={{ maxWidth: 900, margin: "0 auto" }}>
        <div style={{ textAlign: "center", marginBottom: 56 }}>
          <div style={{ display: "inline-block", background: "var(--terra-light)", color: "var(--terra)", fontSize: 12, fontWeight: 500, letterSpacing: "0.1em", textTransform: "uppercase", padding: "5px 14px", borderRadius: 32, marginBottom: 16 }}>Cronograma</div>

                  const evt = eventMap[toDateStr(day)];
                  const isSelected = selectedDay === day;
                  return (
                    <button key={i}
                      onClick={() => setSelectedDay(evt ? (isSelected ? null : day) : null)}

                        transition: "all 0.15s",

                        position: "relative",

                      onMouseEnter={e => { if (evt && !isSelected) e.currentTarget.style.opacity = "0.75"; }}

                      {day}
                      {evt && (
                        <div style={{
                          width: 5, height: 5, borderRadius: "50%",
                          background: isSelected ? "white" : (evt.type === "zoom" ? "var(--sage)" : "var(--terra)"),
                          position: "absolute", bottom: 5,

                  );

              </div>
            )}

              <div style={{ background: "white", borderRadius: 20, border: "1px solid var(--border)", padding: 28 }}>

                  display: "inline-block",
                  background: selectedEvent.type === "zoom" ? "var(--sage-light)" : "var(--terra-light)",
                  color: selectedEvent.type === "zoom" ? "var(--sage)" : "var(--terra)",

                  padding: "4px 12px", borderRadius: 20, marginBottom: 16,
                }}>
                  {selectedEvent.type === "zoom" ? "Clase Zoom" : "Clase Presencial"}
                </div>
                <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 20, fontWeight: 600, marginBottom: 8, lineHeight: 1.3 }}>
                  {selectedEvent.title}
                </div>
                {selectedEvent.desc && (
                  <p style={{ fontSize: 13, color: "var(--muted)", lineHeight: 1.6, marginBottom: 12 }}>
                    {selectedEvent.desc}
                  </p>
                )}
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
                  {[
                    ["📅", formatEventDate(selectedEvent.date)],
                    selectedEvent.time     ? ["🕕", selectedEvent.time + " hs"]  : null,
                    selectedEvent.duration ? ["⏱", selectedEvent.duration]       : null,
                    selectedEvent.type === "zoom" ? ["💻", "Link por WhatsApp"] : null,
                  ].filter(Boolean).map(([icon, val]) => (
                    <div key={val} style={{ display: "flex", gap: 10, fontSize: 14, color: "var(--muted)", alignItems: "center" }}>
                      <span style={{ fontSize: 15 }}>{icon}</span>
                      <span>{val}</span>
                    </div>
                  ))}
                </div>
                <a href="https://wa.me/5492954551339" target="_blank" rel="noopener noreferrer" style={{
                  display: "block", marginTop: 24,
                  background: "var(--terra)", color: "white", textAlign: "center",
                  padding: "12px", borderRadius: 12, fontSize: 14, fontWeight: 500,
                  textDecoration: "none", transition: "opacity 0.2s",
                }}

                  Inscribirme a esta clase
                </a>
              </div>
            ) : (
              <div style={{ background: "white", borderRadius: 20, border: "1px solid var(--border)", padding: 28, flex: 1 }}>
                <div style={{ textAlign: "center", paddingTop: 24 }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>◎</div>
                  <p style={{ fontSize: 14, color: "var(--muted)", lineHeight: 1.7 }}>

                  </p>
                </div>
                {events.length > 0 && (
                  <div style={{ borderTop: "1px solid var(--border)", marginTop: 24, paddingTop: 20 }}>
                    <div style={{ fontSize: 12, fontWeight: 500, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 12 }}>
                      Próximas clases
                    </div>
                    {events.slice(0, 4).map(evt => {
                      const day = parseInt(evt.date.slice(8), 10);
                      return (
                        <div key={evt.date} onClick={() => setSelectedDay(day)} style={{

                          </div>

      </div>
    </section>
